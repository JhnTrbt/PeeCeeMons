[package]
name = "peeceemons"
version = "0.1.0"
description = "A Game Boy Color-style desktop companion"
authors = ["Peeceemons"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "peeceemons_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# Smaller binaries matter here: the whole point is an installer you can send
# to a friend. This trades compile time for roughly half the release size.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
