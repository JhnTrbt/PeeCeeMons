# Builds Peeceemons for Windows and macOS and attaches both to a GitHub
# Release. macOS binaries cannot be produced on a Windows machine — Apple's
# toolchain only runs on macOS — so this workflow is how you get a Mac build
# without owning a Mac. GitHub's macOS runners are free for public repos.
#
# Trigger it by pushing a tag:
#     git tag v0.1.0 && git push origin v0.1.0
# or run it by hand from the Actions tab, giving it an existing tag to build.
#
# The hand-run path exists so you can add a Mac build to a tag that was
# released from a Windows machine without cutting a new version.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true
        type: string

jobs:
  build:
    # On a tag push this is the tag itself; on a hand-run it is whatever was
    # typed in. Without this, a hand-run would resolve to the branch name and
    # publish a release tagged "main".
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal binary: one download that runs on both Apple Silicon
          # and older Intel Macs.
          - os: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin --bundles dmg,app"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"

    runs-on: ${{ matrix.os }}
    steps:
      # Check out the tag, not the default branch — a hand-run would
      # otherwise build whatever is on main and label it with the tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # There is no frontend build step: the app is plain HTML/CSS/JS with no
      # bundler, so Tauri picks src/ up directly.
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Peeceemons ${{ env.RELEASE_TAG }}"
          releaseBody: |
            Download the installer for your platform below.

            **Windows** — `.exe` installer. SmartScreen will warn that the
            publisher is unknown; choose More info -> Run anyway.

            **macOS** — `.dmg`. The app is not notarised, so macOS will refuse
            it on first launch. Right-click the app and choose Open, then
            confirm, or run:
            `xattr -cr /Applications/Peeceemons.app`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
